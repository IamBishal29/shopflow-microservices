# Same shape as order-service.yaml, which explains each setting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service
data:
  NOTIFICATION_SERVICE_PORT: '3003'
  KAFKA_BROKERS: shopflow-kafka-bootstrap:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification-service
          image: shopflow/notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3003 }
          envFrom:
            - configMapRef: { name: notification-service }
            - secretRef: { name: notification-service }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app.kubernetes.io/name: notification-service }
  ports:
    - { name: http, port: 3003, targetPort: http }
