# Kafka managed by the Strimzi operator (deploy/strimzi). We declare WHAT we want; the
# operator creates the pods, Services, config and certificates, and keeps reconciling them
# (a deleted pod or a changed setting is put back to this spec).
# Bootstrap Service for clients: shopflow-kafka-bootstrap:9092.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels: { strimzi.io/cluster: shopflow }
spec:
  replicas: 1
  roles: [controller, broker] # KRaft: one node is both, as in compose
  storage:
    type: persistent-claim
    size: 1Gi
    deleteClaim: true # local cluster: drop the data with the Kafka resource
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1Gi }
  jvmOptions: { -Xms: 256m, -Xmx: 512m }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: shopflow
spec:
  kafka:
    version: 4.3.2 # newest this Strimzi supports; compose runs 4.4.0 (clients are compatible)
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      auto.create.topics.enable: false # topics are KafkaTopic resources; a typo must fail
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {} # turns KafkaTopic resources into real topics
---
# The compose kafka-init topics, now declared: 3 partitions, key = orderId keeps per-order
# order. Each event topic has a .retry (non-blocking retries) and a .dlq (parked).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order.created.v1
  labels: { strimzi.io/cluster: shopflow }
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order.created.v1.retry
  labels: { strimzi.io/cluster: shopflow }
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order.created.v1.dlq
  labels: { strimzi.io/cluster: shopflow }
spec:
  partitions: 3
  replicas: 1
---
