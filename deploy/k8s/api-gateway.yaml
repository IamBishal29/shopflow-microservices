# Same shape as order-service.yaml, which explains each setting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway
data:
  GATEWAY_PORT: '3000'
  ORDER_SERVICE_URL: http://order-service:3001
  REDIS_URL: redis://redis:6379 # Redis from #25
  NODE_ENV: development # as in compose: enables the dev token endpoint (local only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api-gateway
          image: shopflow/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: api-gateway }
            - secretRef: { name: api-gateway }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports:
    - { name: http, port: 3000, targetPort: http }
