# Gateway state (rate-limit counters, response cache, idempotency keys). A Deployment, not
# a StatefulSet: as in compose the data is disposable (no persistence, nothing to keep).
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # `redis` user of the image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:8.8.4-alpine3.23
          args: [--save, '', --appendonly, 'no']
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
