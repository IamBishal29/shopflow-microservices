# One Postgres for the three service databases (each with its own role, as in compose).
# StatefulSet, not Deployment: a stable identity (postgres-0) and a PersistentVolumeClaim
# per pod that survives restarts and rescheduling. kind provisions it on the node's disk.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: DNS points straight at postgres-0, no load balancing needed
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # `postgres` user of the alpine image
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:18.7-alpine3.24
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: shopflow }
            - { name: POSTGRES_DB, value: orders }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: [pg_isready, -U, shopflow, -d, orders] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, shopflow, -d, orders] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
# Creates the payments/notifications roles and databases; the same idempotent SQL as the
# compose postgres-init service. Jobs have no depends_on: it simply retries (backoff)
# until Postgres accepts connections.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  labels: { app.kubernetes.io/component: setup }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70 }
      containers:
        - name: psql
          image: postgres:18.7-alpine3.24
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: shopflow }
          envFrom:
            - secretRef: { name: postgres } # PGPASSWORD + the two role passwords
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -v ON_ERROR_STOP=1 -d postgres -v pw="$PAYMENTS_DB_PASSWORD" -v npw="$NOTIFICATIONS_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE payments LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'payments') \gexec
              SELECT 'CREATE DATABASE payments OWNER payments'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payments') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE payments FROM PUBLIC;
              SELECT format('CREATE ROLE notifications LOGIN PASSWORD %L', :'npw')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'notifications') \gexec
              SELECT 'CREATE DATABASE notifications OWNER notifications'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notifications') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE notifications FROM PUBLIC;
              REVOKE CONNECT, TEMPORARY ON DATABASE orders FROM PUBLIC;
              SQL
              echo "payments and notifications databases ready"
