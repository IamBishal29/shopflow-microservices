# kubectl apply -k deploy/k8s   (scripts/k8s-up.sh does this for you)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopflow
labels:
  - pairs: { app.kubernetes.io/part-of: shopflow }
resources:
  - namespace.yaml
  - edge.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - migrations.yaml
  - api-gateway.yaml
  - order-service.yaml
  - payment-service.yaml
  - notification-service.yaml
# Images are built locally and loaded into kind under this tag (never `latest`, which
# makes Kubernetes always try to pull).
images:
  - { name: shopflow/api-gateway, newTag: dev }
  - { name: shopflow/order-service, newTag: dev }
  - { name: shopflow/payment-service, newTag: dev }
  - { name: shopflow/notification-service, newTag: dev }
  - { name: shopflow/migrate, newTag: dev }
# One Secret per app (least privilege: a service only sees its own credentials), built
# from gitignored files; copy secrets/*.env.example to secrets/*.env first. The name gets
# a content hash, so changing a secret rolls the pods that use it.
secretGenerator:
  - { name: api-gateway, envs: [secrets/api-gateway.env] }
  - { name: order-service, envs: [secrets/order-service.env] }
  - { name: payment-service, envs: [secrets/payment-service.env] }
  - { name: notification-service, envs: [secrets/notification-service.env] }
  - { name: postgres, envs: [secrets/postgres.env] }
