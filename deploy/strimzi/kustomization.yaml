# Strimzi operator (pinned release), installed into and watching namespace `shopflow`.
# Applied before deploy/k8s: its CRDs must exist before the Kafka resources can be created.
#   kubectl apply --server-side -k deploy/strimzi
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopflow
resources:
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.1/strimzi-cluster-operator-1.3.1.yaml
# The release YAML grants permissions to the operator's ServiceAccount in `myproject`;
# Kustomize moves the objects but not these references (Strimzi's docs use sed for this).
patches:
  - target:
      kind: '(Cluster)?RoleBinding'
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: shopflow
