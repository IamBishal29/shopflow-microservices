name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Real Postgres and Kafka via Testcontainers (GitHub's Ubuntu runners have Docker).
  # Own job: runs in parallel with verify, and a slow image pull never delays lint/unit.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      # Catches broken YAML anchors, bad depends_on targets and missing required variables.
      # Placeholder secret: config only resolves the file, nothing runs with it.
      - name: docker compose config
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-placeholder-not-a-real-secret-0000
      # Renders the Kubernetes manifests (kubectl is preinstalled): catches broken YAML and
      # kustomization errors. The example secrets stand in for the gitignored real ones.
      - name: kubectl kustomize
        run: |
          for f in deploy/k8s/secrets/*.env.example; do cp "$f" "${f%.example}"; done
          kubectl kustomize deploy/k8s > /dev/null

  # Builds every image the Dockerfile produces, so a broken Dockerfile, .dockerignore or
  # missing production dependency fails the PR instead of the first deploy.
  # No registry push (free, no account): images only go into the runner's Docker.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one broken image should not hide the state of the others
      matrix:
        image: [api-gateway, order-service, payment-service, notification-service, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.image == 'migrate' && 'migrate' || 'runtime' }}
          build-args: APP=${{ matrix.image }}
          tags: shopflow/${{ matrix.image }}:ci
          push: false
          load: true # into the runner's Docker, for the smoke test below
          # Layer cache in the GitHub Actions cache, one scope per image so the five
          # builds don't evict each other. mode=max also caches the intermediate stages.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Smoke test ${{ matrix.image }}
        if: matrix.image != 'migrate'
        run: |
          set -u
          image=shopflow/${{ matrix.image }}:ci
          # Runs as the unprivileged node user, never root.
          test "$(docker run --rm --entrypoint id "$image" -u)" = 1000
          # With no config the app must load every module (proves the production
          # dependencies are complete) and then stop at our fail-fast config validation.
          if output=$(docker run --rm "$image" 2>&1); then
            echo "expected a config error, but the app started without config"; exit 1
          fi
          echo "$output" | grep -A4 'Invalid environment configuration' \
            || { echo "$output" | tail -20; echo 'app crashed before config validation (missing module?)'; exit 1; }
      - name: Smoke test migrate
        if: matrix.image == 'migrate'
        run: docker run --rm --entrypoint pnpm shopflow/migrate:ci exec prisma --version
