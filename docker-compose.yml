# Local infrastructure. Redis is added by its own issue (M3).
# Database-per-service: one Postgres server, one database + role per service
# ("orders" for order-service, "payments" for payment-service, created by postgres-init).
services:
  postgres:
    image: postgres:18.7-alpine3.24
    container_name: shopflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, idempotent: creates payment-service's own role and database, and removes the
  # default "any role may connect" grant, so each service's role can only reach its own DB.
  # (The image's initdb scripts would only run on an empty volume; this runs every `up`.)
  postgres-init:
    image: postgres:18.7-alpine3.24
    container_name: shopflow-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shopflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      ORDERS_DB: ${POSTGRES_DB:-orders}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -d postgres -v pw="$$PAYMENTS_DB_PASSWORD" -v orders="$$ORDERS_DB" <<'SQL'
        SELECT format('CREATE ROLE payments LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'payments') \gexec
        SELECT 'CREATE DATABASE payments OWNER payments'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payments') \gexec
        REVOKE CONNECT, TEMPORARY ON DATABASE payments FROM PUBLIC;
        REVOKE CONNECT, TEMPORARY ON DATABASE :"orders" FROM PUBLIC;
        SQL
        echo "payments database ready"

  # Single-node Kafka in KRaft mode: one process is both broker and controller, no ZooKeeper.
  kafka:
    image: apache/kafka:4.4.0
    container_name: shopflow-kafka
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers (kafka:29092), EXTERNAL for apps on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created explicitly by kafka-init; a typo must fail, not create a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot job: creates the topics from docs/ARCHITECTURE.md, then exits.
  # 3 partitions per topic; the message key (orderId) decides the partition, so all
  # events of one order stay in order.
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: shopflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        for topic in order.created.v1 payment.succeeded.v1 payment.failed.v1 \
                     order.created.v1.dlq payment.succeeded.v1.dlq payment.failed.v1.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  # Web UI to browse topics, messages and consumer groups: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: shopflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: shopflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  postgres-data:
