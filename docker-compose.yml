# The whole stack: `docker compose up -d --build` (needs JWT_SECRET in .env).
# Infra only, for running the apps on the host with `pnpm start:*`:
#   docker compose up -d postgres postgres-init kafka kafka-init kafka-ui redis
# Database-per-service: one Postgres server, one database + role per service
# ("orders" for order-service; "payments" and "notifications" created by postgres-init).
#
# Startup order (depends_on conditions):
#   postgres (healthy) -> postgres-init (done) -> *-migrate (done) -> service
#   kafka (healthy) -> kafka-init (topics, done) -> service
#   order-service (healthy) + redis (healthy) -> api-gateway
# depends_on only orders the FIRST start. If Postgres or Kafka goes down later, the apps
# keep running: readiness turns 503 and Kafka consumers/relays retry (see learning note 30).

x-migrate: &migrate
  image: shopflow/migrate
  build: { context: ., target: migrate }
  restart: 'no'
  depends_on:
    postgres-init:
      condition: service_completed_successfully

x-app: &app
  restart: unless-stopped
  # Docker's default (10 s) before SIGKILL; graceful shutdown normally takes < 1 s.
  stop_grace_period: 10s

# Ready = the service answers /health/ready (its DB is reachable). Gates dependants.
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18.7-alpine3.24
    container_name: shopflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, idempotent: creates payment- and notification-service's own roles and
  # databases, and removes the default "any role may connect" grant, so each service's role
  # can only reach its own DB.
  # (The image's initdb scripts would only run on an empty volume; this runs every `up`.)
  postgres-init:
    image: postgres:18.7-alpine3.24
    container_name: shopflow-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shopflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      ORDERS_DB: ${POSTGRES_DB:-orders}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -d postgres -v pw="$$PAYMENTS_DB_PASSWORD" -v npw="$$NOTIFICATIONS_DB_PASSWORD" -v orders="$$ORDERS_DB" <<'SQL'
        SELECT format('CREATE ROLE payments LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'payments') \gexec
        SELECT 'CREATE DATABASE payments OWNER payments'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payments') \gexec
        REVOKE CONNECT, TEMPORARY ON DATABASE payments FROM PUBLIC;
        SELECT format('CREATE ROLE notifications LOGIN PASSWORD %L', :'npw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'notifications') \gexec
        SELECT 'CREATE DATABASE notifications OWNER notifications'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notifications') \gexec
        REVOKE CONNECT, TEMPORARY ON DATABASE notifications FROM PUBLIC;
        REVOKE CONNECT, TEMPORARY ON DATABASE :"orders" FROM PUBLIC;
        SQL
        echo "payments and notifications databases ready"

  # Single-node Kafka in KRaft mode: one process is both broker and controller, no ZooKeeper.
  kafka:
    image: apache/kafka:4.4.0
    container_name: shopflow-kafka
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers (kafka:29092), EXTERNAL for apps on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created explicitly by kafka-init; a typo must fail, not create a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot job: creates the topics from docs/ARCHITECTURE.md, then exits.
  # 3 partitions per topic; the message key (orderId) decides the partition, so all
  # events of one order stay in order.
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: shopflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        # Each event topic gets a .retry topic (non-blocking retries) and a .dlq (parked).
        for base in order.created.v1 payment.succeeded.v1 payment.failed.v1; do
          for topic in "$$base" "$$base.retry" "$$base.dlq"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
              --topic "$$topic" --partitions 3 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  # Web UI to browse topics, messages and consumer groups: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: shopflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: shopflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Gateway state: rate-limit counters now; response cache (#18) and idempotency keys (#19)
  # later. No volume and no persistence: counters are disposable (a restart = fresh windows).
  redis:
    image: redis:8.8.4-alpine3.23
    container_name: shopflow-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- migrations: one-shot jobs, one per service database -------------------------------
  order-migrate:
    <<: *migrate
    container_name: shopflow-order-migrate
    environment:
      ORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD:-shopflow}@postgres:5432/${POSTGRES_DB:-orders}
    command: ['--config', 'apps/order-service/prisma.config.ts']

  payment-migrate:
    <<: *migrate
    container_name: shopflow-payment-migrate
    environment:
      PAYMENT_DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments}@postgres:5432/payments
    command: ['--config', 'apps/payment-service/prisma.config.ts']

  notification-migrate:
    <<: *migrate
    container_name: shopflow-notification-migrate
    environment:
      NOTIFICATION_DATABASE_URL: postgresql://notifications:${NOTIFICATIONS_DB_PASSWORD:-notifications}@postgres:5432/notifications
    command: ['--config', 'apps/notification-service/prisma.config.ts']

  # --- services (Dockerfile, one image per APP) -------------------------------------------
  order-service:
    <<: *app
    image: shopflow/order-service
    build: { context: ., args: { APP: order-service } }
    container_name: shopflow-order-service
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ORDER_SERVICE_PORT: 3001
      ORDER_DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD:-shopflow}@postgres:5432/${POSTGRES_DB:-orders}
      KAFKA_BROKERS: kafka:29092
    ports:
      - '${ORDER_SERVICE_PORT:-3001}:3001'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/health/ready']

  payment-service:
    <<: *app
    image: shopflow/payment-service
    build: { context: ., args: { APP: payment-service } }
    container_name: shopflow-payment-service
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      PAYMENT_SERVICE_PORT: 3002
      PAYMENT_DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments}@postgres:5432/payments
      KAFKA_BROKERS: kafka:29092
    ports:
      - '${PAYMENT_SERVICE_PORT:-3002}:3002'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3002/health/ready']

  notification-service:
    <<: *app
    image: shopflow/notification-service
    build: { context: ., args: { APP: notification-service } }
    container_name: shopflow-notification-service
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      NOTIFICATION_SERVICE_PORT: 3003
      NOTIFICATION_DATABASE_URL: postgresql://notifications:${NOTIFICATIONS_DB_PASSWORD:-notifications}@postgres:5432/notifications
      KAFKA_BROKERS: kafka:29092
    ports:
      - '${NOTIFICATION_SERVICE_PORT:-3003}:3003'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3003/health/ready']

  api-gateway:
    <<: *app
    image: shopflow/api-gateway
    build: { context: ., args: { APP: api-gateway } }
    container_name: shopflow-api-gateway
    depends_on:
      order-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Local stack only: enables POST /auth/token so the README demo can get dev tokens.
      NODE_ENV: development
      GATEWAY_PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
      REDIS_URL: redis://redis:6379
      # No default on purpose: a secret baked into a committed file is a public secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in .env}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health/ready']

volumes:
  postgres-data:
